run_id: example-run-v1
overwrite: true 

run_tasks:
  - reconstruction
  - dependency_maps

dataset:
  dataset_id: ribosome
  prepared_dir: data/prepared/ribosome

model:
  adapter: random

  random:
    seed: 42
    max_context_length: 1022
  rinalmo:
    size: micro
    weights: models/rinalmo/rinalmo_micro_pretrained.pt
    device: cuda:0

reconstruction:
  context_length: 512
  batch_size: 8
  plot_results: true

dependency_maps:
  mode: region
  batch_size: 8
  dependency_by_masking: false
  with_reconstruction: true
  manual:
    start: 4000
    end: 43
    record_ids:
      - Mammalia-Artiodactyla-Addax nasomaculatus-GCA_044231825-morph3
      - Mammalia-Artiodactyla-Bos indicus-GCF_029378745-morph1
  region:
    # Matches an exact label or feature_type value.
    label: 18S_rRNA
    # record_ids: all
    # record_ids can instead be a non-empty explicit list:
    record_ids:
      - Mammalia-Artiodactyla-Addax nasomaculatus-GCA_044231825-morph3
      - Mammalia-Artiodactyla-Bos indicus-GCF_029378745-morph1
    # error rejects regions longer than the model context. tile creates
    # overlapping local maps, which cannot recover interactions between bases
    # that never occur in the same tile.
    long_region_policy: tile
    tile_length: 512
    tile_stride: 384
  

outputs_root: outputs/runs
