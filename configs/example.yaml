# Names the output directory under outputs_root.
run_id: example-run-v1

# false rejects an existing run directory; true allows files to be replaced.
overwrite: true

# Include any supported task; block_scores can also run alone on an existing run.
run_tasks:
  # - reconstruction
  - dependency_maps
  - block_scores

dataset:
  # Stored in manifests and result tables.
  dataset_id: ribosome
  # ribosome_test
  # Must contain records.parquet and regions.parquet.
  prepared_dir: data/prepared/ribosome

model:
  # Selects one nested model block below. The other blocks are ignored.
  adapter: random

  # Pipeline smoke-test model. Its scores are not scientifically meaningful.
  random:
    # Makes random smoke-test outputs reproducible.
    seed: 42
    # Maximum sequence length accepted by this adapter.
    max_context_length: 1022

  rinalmo:
    # This repository currently supports only the micro model size.
    size: micro
    # Checkpoint path relative to the repository root.
    weights: models/rinalmo/rinalmo_micro_pretrained.pt
    # PyTorch inference device. CUDA must be available for cuda:0.
    #lora_weights: outputs/runs/your-run-id/checkpoint_latest.pt
    device: cuda:0

  evo2:
    # Model name passed to the evo2 package.
    model_name: evo2_7b
    # Local Hugging Face cache directory relative to the repository root.
    cache_dir: models/evo2
    # PyTorch inference device. CUDA must be available for cuda:0.
    device: cuda:0

reconstruction:
  # Context around each masked target; it must fit the model context limit.
  context_length: 1022
  # Number of target contexts passed through the model per batch.
  batch_size: 8
  # Write summary plots from the per-region reconstruction results.
  plot_results: true

dependency_maps:
  # Context around each configured map interval; it must fit the model limit.
  # If omitted, dependency maps use only the configured interval.
  context_length: 1022
  # Selects either the manual or region block below. The other block is ignored.
  mode: region
  # Controls batching in dependency-map model forward calls.
  batch_size: 8
  # false substitutes query bases; true masks query positions.
  dependency_by_masking: false
  # Also store reconstruction probabilities in each saved map result.
  with_reconstruction: true
  # Write HTML/PDF dependency-map plots. Disable for raw .npz-only runs.
  plot_results: false

  manual:
    # Apply this 0-based, end-exclusive interval to every listed record.
    start: 4000
    end: 4100
    # Values must exactly match prepared record_id values.
    record_ids:
      - Mammalia-Artiodactyla-Addax nasomaculatus-GCA_044231825-morph3
      # - Mammalia-Artiodactyla-Bos indicus-GCF_029378745-morph1

  region:
    # Exact match against the prepared label or feature_type column.
    label: TTF1
    # Use "all", "half", or a non-empty explicit list of record IDs.
    record_ids: half
    # record_ids:
    #   - Mammalia-Artiodactyla-Addax nasomaculatus-GCA_044231825-morph3
      # - Mammalia-Artiodactyla-Bos indicus-GCF_029378745-morph1
    # error rejects long regions; tile creates overlapping local maps.
    # Tiles cannot connect positions that never occur together in one tile.
    long_region_policy: tile
    # Tile size for long regions; it must not exceed the model context limit.
    tile_length: 512
    # Distance between regular tile starts; smaller values increase overlap.
    tile_stride: 384
    # Optional matched-background dependency maps. Disabled by default.
    # When enabled, each selected annotated region gets n_per_region
    # same-length background maps sampled inside its strict parent annotation.
    background:
      enabled: true
      n_per_region: 5
      min_distance_bp: 5
      seed: 42

block_scores:
  # Width of the consecutive diagonal dependency block in nucleotides.
  block_size: 6
  # First quartile of off-diagonal directed dependencies within each block.
  quantile: 0.25
  # Write descriptive summary and per-map companion plots.
  plot_results: true

# Parent directory for run_id output directories, relative to the repository.
outputs_root: outputs/runs
