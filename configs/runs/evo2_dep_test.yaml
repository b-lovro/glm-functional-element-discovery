run_id: evo2_dep_test
overwrite: true

run_tasks:
  - dependency_maps

dataset:
  dataset_id: ribosome
  prepared_dir: data/prepared/ribosome

model:
  adapter: evo2

  evo2:
    model_name: evo2_7b
    cache_dir: models/evo2
    device: cuda:0

dependency_maps:
  # Selects either the manual or region block below. The other block is ignored.
  mode: manual
  # Controls batching in dependency-map model forward calls.
  batch_size: 1
  # false substitutes query bases; true masks query positions.
  dependency_by_masking: false
  # Also store reconstruction probabilities in each saved map result.
  with_reconstruction: true

  manual:
    start: 4000
    end: 5000
    record_ids:
      - Mammalia-Artiodactyla-Addax nasomaculatus-GCA_044231825-morph3

outputs_root: outputs/runs
