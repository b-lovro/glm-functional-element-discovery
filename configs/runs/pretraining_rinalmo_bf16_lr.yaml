# Names the output directory under outputs_root.
run_id: pretraining-rinalmo-bf16-lr

# false rejects an existing run directory; true allows files to be replaced.
overwrite: true

dataset:
  # Stored in manifests and result tables.
  dataset_id: ribosome
  # Must contain records.parquet
  prepared_dir: data/prepared/ribosome
  splits:
    train: 0.8
    val: 0.1
    test: 0.1
    overfit: 0.01 # Used if run_split is 'overfit'

model:
  # Selects one nested model block below. The other blocks are ignored.
  adapter: rinalmo

  rinalmo:
    # This repository currently supports only the micro model size.
    size: mega
    # Checkpoint path relative to the repository root.
    weights: models/rinalmo/rinalmo_mega_pretrained.pt
    # PyTorch inference device. CUDA must be available for cuda:0.
    device: cuda:0

training:
  run_split: train # Options: train, overfit
  epochs: 5000 # Probably will need WAY more
  learning_rate: 5e-5
  weight_decay: 0.01
  max_grad_norm: 1.0           
  warmup_fraction: 0.1 # Fraction of total steps to warm up the learning rate
  lr_scheduler: "cosine"
  batch_size: 128 # Use largest that fits in GPU
  num_workers: 4
  seed: 42
  
  logging:
    wandb_project: glm-functional-element-discovery
    log_interval: 1

  lora:
    r: 16
    alpha: 32
    dropout: 0.1
    target_modules: all-linear

# Parent directory for run_id output directories, relative to the repository.
outputs_root: outputs/runs